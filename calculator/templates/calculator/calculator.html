<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Scientific Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --background-color: #f5f6fa;
        }

        body {
            background: linear-gradient(135deg, #8a2525 0%, #2a5298 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--primary-color);
        }

        .calculator-container {
            max-width: 600px;
            margin: 2rem auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .calculator-container:hover {
            transform: translateY(-5px);
        }

        .calculator-header {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }

        .calculator-header h2 {
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }

        .btn-calculate {
            background: var(--secondary-color);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-calculate:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .result-container {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 10px;
            background: #f8f9fa;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .operation-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 1rem;
        }

        .operation-btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #f1f1f1;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .operation-btn:hover {
            background: var(--secondary-color);
            color: white;
        }

        .history-section {
            margin-top: 2rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-header">
            <h2><i class="fas fa-calculator"></i> Advanced Calculator</h2>
            <p class="text-muted">Perform complex calculations</p>
        </div>

        <form id="calculatorForm" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="num1" class="form-label">First Number</label>
                <input type="number" step="any" class="form-control" id="num1" name="num1" required>
            </div>
            <div class="mb-3">
                <label for="num2" class="form-label">Second Number (Optional)</label>
                <input type="number" step="any" class="form-control" id="num2" name="num2">
            </div>
            <div class="mb-3">
                <label class="form-label">Select Operation</label>
                <select class="form-select" name="operation" required>
                    <optgroup label="Basic Operations">
                        <option value="add">Addition (+)</option>
                        <option value="subtract">Subtraction (-)</option>
                        <option value="multiply">Multiplication (×)</option>
                        <option value="divide">Division (÷)</option>
                    </optgroup>
                    <optgroup label="Advanced Operations">
                        <option value="modulus">Modulus (%)</option>
                        <option value="exponentiation">Exponentiation (^)</option>
                        <option value="square_root">Square Root (√)</option>
                        <option value="factorial">Factorial (n!)</option>
                    </optgroup>
                    <optgroup label="Logarithmic Functions">
                        <option value="log">Logarithm Base 10 (log x)</option>
                        <option value="ln">Natural Logarithm (ln x)</option>
                    </optgroup>
                    <optgroup label="Trigonometric Functions">
                        <option value="sin">Sine (sin x)</option>
                        <option value="cos">Cosine (cos x)</option>
                        <option value="tan">Tangent (tan x)</option>
                    </optgroup>
                    <optgroup label="Hyperbolic Functions">
                        <option value="sinh">Hyperbolic Sine (sinh x)</option>
                        <option value="cosh">Hyperbolic Cosine (cosh x)</option>
                        <option value="tanh">Hyperbolic Tangent (tanh x)</option>
                    </optgroup>
                    <optgroup label="Inverse Functions">
                        <option value="asin">Inverse Sine (asin x)</option>
                        <option value="acos">Inverse Cosine (acos x)</option>
                        <option value="atan">Inverse Tangent (atan x)</option>
                    </optgroup>
                </select>
            </div>

            <div class="operation-buttons">
                <button type="button" class="operation-btn" data-op="add">+</button>
                <button type="button" class="operation-btn" data-op="subtract">-</button>
                <button type="button" class="operation-btn" data-op="multiply">×</button>
                <button type="button" class="operation-btn" data-op="divide">÷</button>
                <button type="button" class="operation-btn" data-op="square_root">√</button>
                <button type="button" class="operation-btn" data-op="factorial">!</button>
                <button type="button" class="operation-btn" data-op="sin">sin</button>
                <button type="button" class="operation-btn" data-op="cos">cos</button>
            </div>

            <button type="submit" class="btn btn-calculate">
                <i class="fas fa-equals"></i> Calculate
            </button>
        </form>

        <div id="result" class="result-container">
            <h4>Result: <span id="resultValue"></span></h4>
        </div>

        <div class="history-section">
            <h5>Calculation History</h5>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        $(document).ready(function(){
            let history = [];
            
            // Operation button click handlers
            $('.operation-btn').click(function() {
                const operation = $(this).data('op');
                $('select[name="operation"]').val(operation);
            });

            $("#calculatorForm").on("submit", function(event){
                event.preventDefault();
                const formData = $(this).serialize();
                
                $.ajax({
                    url: "",
                    type: "POST",
                    data: formData,
                    success: function(response){
                        if (response.result !== undefined) {
                            const num1 = $("#num1").val();
                            const num2 = $("#num2").val();
                            const operation = $("select[name='operation'] option:selected").text();
                            
                            // Add to history
                            const historyItem = `${num1} ${operation} ${num2 || ''} = ${response.result}`;
                            history.unshift(historyItem);
                            if (history.length > 10) history.pop();
                            
                            // Update history display
                            $("#historyList").html(history.map(item => 
                                `<div class="history-item">${item}</div>`
                            ).join(''));
                            
                            // Show result with animation
                            $("#resultValue").text(response.result);
                            $("#result").hide().show();
                        } else {
                            $("#resultValue").text("Error: No result returned.");
                            $("#result").hide().show();
                        }
                    },
                    error: function() {
                        $("#resultValue").text("Error processing request.");
                        $("#result").hide().show();
                    }
                });
            });
        });
    </script>
</body>
</html>
